name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version tag '${{ inputs.version }}'. Must match vX.Y.Z (e.g. v0.1.0)."
            exit 1
          fi
          echo "Version tag '${{ inputs.version }}' is valid."

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          (cd "target/${{ matrix.target }}/release" && 7z a "../../../objviewer-${{ matrix.target }}.zip" "objviewer${{ matrix.ext }}")

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "objviewer-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" objviewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: objviewer-${{ matrix.target }}
          path: objviewer-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            objviewer-x86_64-pc-windows-msvc/objviewer-x86_64-pc-windows-msvc.zip
            objviewer-x86_64-unknown-linux-gnu/objviewer-x86_64-unknown-linux-gnu.tar.gz
            objviewer-x86_64-apple-darwin/objviewer-x86_64-apple-darwin.tar.gz
