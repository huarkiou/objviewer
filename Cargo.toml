[package]
name = "objviewer"
version = "0.1.0"
edition = "2024"
description = "Lightweight Wavefront OBJ file viewer"

[dependencies]
# Windowing and events
winit = "0.30"

# Graphics (GPU rendering)
wgpu = "29.0"

# UI framework
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"

# Math library
glam = "0.32"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Safe casting
bytemuck = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

# Async runtime for wgpu init
pollster = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true
